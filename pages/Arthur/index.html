<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial Pokémon</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #ffcb05;
            color: #3d7d28;
            padding: 20px;
        }
        .main-content {
            padding: 50px 20px;
        }
        .image-container img {
            width: 150px;
            height: auto;
        }
        .links {
            margin-top: 30px;
        }
        .links a {
            text-decoration: none;
            margin: 10px;
            padding: 15px 30px;
            background-color: #3d7d28;
            color: white;
            border-radius: 5px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        .links a:hover {
            background-color: #ffcb05;
            color: #3d7d28;
        }
        footer {
            background-color: #3d7d28;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bem-vindo ao Mundo Pokémon!</h1>
        <p>Escolha seu Pokémon favorito e comece a jornada!</p>
    </header>

    <section class="main-content">
        <div class="image-container">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu">
        </div>
        

        

        <div id="conteudo" class="container">
            <button class="btn btn-Iniciar Jornada" id="btnIniciar Jornada">Iniciar Jornada</button>
            <button class="btn btn-Pokémon" id="btn-Pokémon">Pokémon</button>
            <button class="btn btn-Pokémon" id="btn-Pokémon">Pokémon</button>
            <button class="btn btn-Pokémon" id="btn-Pokémon">Pokémon</button>
          </div>

    </section>

    <footer>
        <p></p>
    </footer>
</body>
</html>
